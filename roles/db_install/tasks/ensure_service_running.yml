---
- name: Restart Mariadb to apply the configure file
  block:
    - name: Ensure Mariadb is started
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Restart Mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted
        enabled: true
