---
# tasks file for roles/neutron/tasks/neutron_nic_configuration.yml
- name: Check if the tasks has been running
  block:
    - name: Ensure Mark Directory Exists
      ansible.builtin.file:
        path: "{{ neutron_mark_dir_path }}"
        state: directory
        mode: '0755'

    - name: Check if neutron tasks have been run
      ansible.builtin.stat:
        name: "{{ neutron_mark_files_path.nic_conf_success }}"
      register: neutron_mark_file

    - name: Skip if neutron tasks have been run
      ansible.builtin.meta: end_role
      when: neutron_mark_file.stat.exists

- name: Configure nic and add OVS bridge
  block:
    # 第一步：先清空所有可能冲突的 IPv4 配置（尤其是 dns4）
    - name: Clear IPv4 DNS and addresses on {{ neutron_ovs_conf.nic_name }}
      community.general.nmcli:
        conn_name: "{{ neutron_ovs_conf.nic_name }}"
        ifname: "{{ neutron_ovs_conf.nic_name }}"
        type: ethernet
        dns4: []                  # 清空 DNS（关键！）
        dns4_ignore_auto: true
        gw4: ""                   # 清空网关
        # addresses 不需要显式清空，method 改动时会自动处理
        state: present

    # 第二步：再禁用 IPv4 + 忽略 IPv6
    - name: Disable IPv4 and ignore IPv6 on {{ neutron_ovs_conf.nic_name }}
      community.general.nmcli:
        conn_name: "{{ neutron_ovs_conf.nic_name }}"
        ifname: "{{ neutron_ovs_conf.nic_name }}"
        type: ethernet
        method4: disabled         # 现在可以安全设置了
        method6: ignore
        autoconnect: true
        state: present

- name: Add OVS bridge
  block:
    - name: Ensure OpenvSwitch service is running
      ansible.builtin.service:
        name: openvswitch
        state: started

    - name: Create OVS bridge
      openvswitch.openvswitch.openvswitch_bridge:
        bridge: "{{ neutron_ovs_conf.bridge_port_name }}"
        state: present
        fail_mode: standalone

    - name: Add nic to OVS bridge
      openvswitch.openvswitch.openvswitch_port:
        bridge: "{{ neutron_ovs_conf.bridge_port_name }}"
        port: "{{ neutron_ovs_conf.nic_name }}"
        state: present

- name: Create Marks to indicate the tasks have been run
  ansible.builtin.file:
    path: "{{ neutron_mark_files_path.nic_conf_success }}"
    state: touch
    mode: '0755'
