---

- name: Install NTP Server Packages(RedHat Family)
  ansible.builtin.dnf:
    name: "{{ ntp_server_redhat_packages }}"
    state: present
  when: ansible_facts.os_family == "RedHat"
  tags:
    - redhat

- name: Install NTP Server Packages(Debian Family)
  ansible.builtin.apt:
    name: "{{ ntp_server_debian_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - debian
