---
# 通过判断包是否存在来判断下一步是安装还是继续执行其他任务的命令
# 通过判断包是否存在来判断下一步是安装还是继续执行其他任务的命令
- name: Check if dns server is installed and running
  block:
    # 这个地方是用来收集已经安装的包的信息
    - name: Gather facts of installed packages
      ansible.builtin.package_facts:
        manager: auto

    # 这里记录了一个不需要安装的值，如果包存在就返回一个True
    - name: Check if unbound package status
      ansible.builtin.set_fact:
        dns_server_packages_installed: "{{ 'unbound' in ansible_facts.packages }}"

    # 这里记录了一个需要安装的值,如果包不存在就返回一个True
    - name: Register unbound package status
      ansible.builtin.set_fact:
        dns_server_packages_need_install: "{{ 'unbound' not in ansible_facts.packages }}"

    # 打印包状态
    - name: Print unbound package status
      ansible.builtin.debug:
        msg:
          - "Unbound package status:"
          - "Unbound {{ 'Has been installed' if 'unbound' in ansible_facts.packages else 'Has not been installed' }}"
      when: dns_server_packages_installed

    # 记录服务状态
    - name: Register unbound service status
      # ansible.builtin.shell: systemctl is-active unbound
      # register: dns_server_unbound_service_is_active_status
      # ignore_errors: true
      # when: dns_server_packages_installed
      # changed_when: false
      ansible.builtin.systemd_service:
        name: unbound
      register: dns_server_unbound_service_info
      when: dns_server_packages_installed

    # 记录服务状态
    # - name: Register unbound service is-enabled status
      # ansible.builtin.shell: systemctl is-enabled unbound
      # register: dns_server_unbound_service_is_enabled_status
      # ignore_errors: true
      # when: dns_server_packages_installed
      # changed_when: false

    # 打印服务状态
    - name: Print unbound service status debug
      ansible.builtin.debug:
        msg:
          - "Unbound service status:"
          - "Unbound service is {{ dns_server_unbound_service_info.status.ActiveState }} and {{ dns_server_unbound_service_info.status.UnitFileState }}"
      when: dns_server_packages_installed

    # 如果包不存在的包，就进行安装
    - name: Start install DNS Server Packages(unbound)
      ansible.builtin.package:
        name: "{{ dns_server_packages }}"
        state: present
      when: dns_server_packages_need_install
